name: Deployment Workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  Deploy-Docker-Infra:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on remote server
        uses: appleboy/ssh-action@v1.2.0

        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # FAIL2BAN
          FAIL2BAN_FAIL2BAN_UI_DOMAIN: ${{ secrets.FAIL2BAN_UI_DOMAIN_FAIL2BAN_UI_DOMAIN }}
          FAIL2BAN_FAIL2BAN_UI_PORT:  ${{ secrets.FAIL2BAN_FAIL2BAN_UI_PORT }}
          FAIL2BAN_TRAEFIK_MIDDLEWARE: ${{ secrets.FAIL2BAN_TRAEFIK_MIDDLEWARE }}
          FAIL2BAN_ENTRYPOINTS: ${{ secrets.FAIL2BAN_ENTRYPOINTS }}
          FAIL2BAN_TLS: ${{ secrets.FAIL2BAN_TLS }}

          # Monitoring
          MONITORING_UPTIME_PUBLIC_HOST: ${{ secrets.MONITORING_UPTIME_PUBLIC_HOST }}
          MONITORING_UPTIME_PRIVATE_HOST: ${{ secrets.MONITORING_UPTIME_PRIVATE_HOS }}
          MONITORING_UPTIME_PORT: ${{ secrets.MONITORING_UPTIME_PORT }}
          MONITORING_TRAEFIK_MIDDLEWARE: ${{ secrets.MONITORING_TRAEFIK_MIDDLEWARE }}

          # Tasklist
          TASKLIST_TASKLIST_DOMAIN: ${{ secrets.TASKLIST_TASKLIST_DOMAIN }}
          TASKLIST_FRONTEND_PORT: ${{ secrets.TASKLIST_FRONTEND_PORT }}
          TASKLIST_BACKEND_PORT: ${{ secrets.TASKLIST_BACKEND_PORT }}
          TASKLIST_TRAEFIK_MIDDLEWARE: ${{ secrets.TASKLIST_TRAEFIK_MIDDLEWARE }}
          TASKLIST_DB_HOST: ${{ secrets.TASKLIST_DB_HOST }}
          TASKLIST_DB_PORT: ${{ secrets.TASKLIST_DB_PORT }}
          TASKLIST_DB_USER: ${{ secrets.TASKLIST_DB_USER }}
          TASKLIST_DB_PASSWORD: ${{ secrets.TASKLIST_DB_PASSWORD }}
          TASKLIST_DB_NAME: ${{ secrets.TASKLIST_DB_NAME }}
          TASKLIST_MARIADB_ROOT_PASSWORD: ${{ secrets.TASKLIST_MARIADB_ROOT_PASSWORD }}

          # Traefik
          TRAEFIK_TRAEFIK_PORT_1: ${{ secrets.TRAEFIK_TRAEFIK_PORT_1 }}
          TRAEFIK_TRAEFIK_PORT_2: ${{ secrets.TRAEFIK_TRAEFIK_PORT_2 }}
          TRAEFIK_SERVER_PORT: ${{ secrets.TRAEFIK_SERVER_PORT }}
          TRAEFIK_TRAEFIK_DOMAIN: ${{ secrets.TRAEFIK_TRAEFIK_DOMAIN }}
          TRAEFIK_TRAEFIK_MIDDLEWARE: ${{ secrets.TRAEFIK_TRAEFIK_MIDDLEWARE }}
          TRAEFIK_URL: ${{ secrets.TRAEFIK_URL }}
          TRAEFIK_USER: ${{ secrets.TRAEFIK_USER }}
          TRAEFIK_ID: ${{ secrets.TRAEFIK_ID }}
          TRAEFIK_SECRET: ${{ secrets.TRAEFIK_SECRET }}
          TRAEFIK_WHITELIST: ${{ secrets.TRAEFIK_WHITELIST }}
          TRAEFIK_TINYAUTH_URL: ${{ secrets.TRAEFIK_TINYAUTH_URL }}
          TRAEFIK_FORWARD_ADRESS: ${{ secrets.TRAEFIK_FORWARD_ADRESS }}

          # Wiki
          WIKI_URL_WIKI: ${{ secrets.WIKI_URL_WIKI }}
          WIKI_PORT: ${{ secrets.WIKI_PORT }}
          
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          envs: GH_TOKEN,FAIL2BAN_FAIL2BAN_UI_DOMAIN,FAIL2BAN_FAIL2BAN_UI_PORT,FAIL2BAN_TRAEFIK_MIDDLEWARE,FAIL2BAN_ENTRYPOINTS,FAIL2BAN_TLS,MONITORING_UPTIME_PUBLIC_HOST,MONITORING_UPTIME_PRIVATE_HOST,MONITORING_UPTIME_PORT,MONITORING_TRAEFIK_MIDDLEWARE,TASKLIST_TASKLIST_DOMAIN,TASKLIST_FRONTEND_PORT,TASKLIST_BACKEND_PORT,TASKLIST_TRAEFIK_MIDDLEWARE,TASKLIST_DB_HOST,TASKLIST_DB_PORT,TASKLIST_DB_USER,TASKLIST_DB_PASSWORD,TASKLIST_DB_NAME,TASKLIST_MARIADB_ROOT_PASSWORD,TRAEFIK_TRAEFIK_PORT_1,TRAEFIK_TRAEFIK_PORT_2,TRAEFIK_SERVER_PORT,TRAEFIK_TRAEFIK_DOMAIN,TRAEFIK_TRAEFIK_MIDDLEWARE,TRAEFIK_URL,TRAEFIK_USER,TRAEFIK_ID,TRAEFIK_SECRET,TRAEFIK_WHITELIST,TRAEFIK_TINYAUTH_URL,TRAEFIK_FORWARD_ADRESS,WIKI_URL_WIKI,WIKI_PORT

          script: |
            # clone le rep
            git clone https://$GH_TOKEN@github.com/EmilienRoche/Serveur-Internet-Sample-Project.git
            
            # copie vers /root/srv
            cp -r Serveur-Internet-Sample-Project/.github/workflows /home/rocky/srv

            # suppression du repo cloné
            rm -rf Serveur-Internet-Sample-Project

            # Fail2Ban
            cd /home/rocky/srv/fail2ban
            cat <<'EOF' > .env
            FAIL2BAN_UI_DOMAIN=$FAIL2BAN_FAIL2BAN_UI_DOMAIN
            FAIL2BAN_UI_PORT=$FAIL2BAN_FAIL2BAN_UI_PORT
            TRAEFIK_MIDDLEWARE=$FAIL2BAN_TRAEFIK_MIDDLEWARE
            ENTRYPOINTS=$FAIL2BAN_ENTRYPOINTS
            TLS=$FAIL2BAN_TLS
            EOF

            # Monitoring
            cd /home/rocky/srv/monitoring
            cat <<'EOF' > .env
            UPTIME_PUBLIC_HOST=$MONITORING_UPTIME_PUBLIC_HOST
            UPTIME_PRIVATE_HOST=$MONITORING_UPTIME_PRIVATE_HOST
            UPTIME_PORT=$MONITORING_UPTIME_PORT
            TRAEFIK_MIDDLEWARE=$MONITORING_TRAEFIK_MIDDLEWARE
            EOF

            # TaskList
            cd /home/rocky/srv/tasklist
            cat <<'EOF' > .env
            TASKLIST_DOMAIN=$TASKLIST_TASKLIST_DOMAIN
            FRONTEND_PORT=$TASKLIST_FRONTEND_PORT
            BACKEND_PORT=$TASKLIST_BACKEND_PORT
            TRAEFIK_MIDDLEWARE=$TASKLIST_TRAEFIK_MIDDLEWARE
            DB_HOST=$TASKLIST_DB_HOST
            DB_PORT=$TASKLIST_DB_PORT
            DB_USER=$TASKLIST_DB_USER
            DB_PASSWORD=$TASKLIST_DB_PASSWORD
            DB_NAME=$TASKLIST_DB_NAME
            MARIADB_ROOT_PASSWORD=$TASKLIST_MARIADB_ROOT_PASSWORD
            EOF

            # Traefik
            cd /home/rocky/srv/traefik
            cat <<'EOF' > .env
            TRAEFIK_PORT_1=$TRAEFIK_TRAEFIK_PORT_1
            TRAEFIK_PORT_2=$TRAEFIK_TRAEFIK_PORT_2
            SERVER_PORT=$TRAEFIK_SERVER_PORT
            TRAEFIK_DOMAIN=$TRAEFIK_TRAEFIK_DOMAIN
            TRAEFIK_MIDDLEWARE=$TRAEFIK_TRAEFIK_MIDDLEWARE
            URL=$TRAEFIK_URL
            USER=$TRAEFIK_USER
            ID=$TRAEFIK_ID
            SECRET=$TRAEFIK_SECRET
            WHITELIST=$TRAEFIK_WHITELIST
            TINYAUTH_URL=$TRAEFIK_TINYAUTH_URL
            FORWARD_ADRESS=$TRAEFIK_FORWARD_ADRESS
            EOF

            # Wiki
            cd /home/rocky/srv/wiki
            cat <<'EOF' > .env
            URL_WIKI=$WIKI_URL_WIKI
            PORT=$WIKI_PORT
            EOF

            # lancement docker
            cd /home/rocky/srv
            docker compose up -d --force-recreate
