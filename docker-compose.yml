services:
  frontend:
    image: emilienroche/frontend
    container_name: frontend
    networks:
      - proxy
    depends_on:
      - backend
    ports:
     - "8080:8080"
      

  backend:
    image: emilienroche/backend
    container_name: backend
    networks:
      - proxy
    ports:
      - "3000:3000"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tasksdb


  database:
    image: emilienroche/database
    container_name: database
    networks:
      - proxy
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: tasksdb
    volumes:
      - ./db-data:/var/lib/mysql




networks:
  proxy:
    external: true