services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.uptime-public.rule=Host(`${UPTIME_PUBLIC_HOST}`) && (PathPrefix(`/status`) || PathPrefix(`/assets`) || PathPrefix(`/api/status`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.uptime-public.entrypoints=websecure"
      - "traefik.http.routers.uptime-public.tls=true"
      - "traefik.http.routers.uptime-public.service=uptime"

      - "traefik.http.routers.uptime-private.rule=Host(`${UPTIME_PRIVATE_HOST}`)"
      - "traefik.http.routers.uptime-private.middlewares=${TRAEFIK_MIDDLEWARE}"
      - "traefik.http.routers.uptime-private.entrypoints=websecure"
      - "traefik.http.routers.uptime-private.tls=true"
      - "traefik.http.routers.uptime-private.service=uptime"

      - "traefik.http.services.uptime.loadbalancer.server.port=${UPTIME_PORT}"

networks:
  proxy:
    external: true